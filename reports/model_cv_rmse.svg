<title id="title">Five-fold cross-validation RMSE by regression model</title>
<desc id="desc">Linear Regression, Lasso and Ridge have RMSE near 2.038. Gradient Boosting and HistGradientBoosting are near 2.125, Random Forest is 2.274, and Extra Trees is 2.356. Lower is better.</desc>
