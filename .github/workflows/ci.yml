name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run nested repeated-holdout evaluation on the project dataset
        run: python -m src.robustness --n-splits 10 --inner-splits 3 --random-state-start 0 --output-dir reports/robustness-run
      - name: Upload nested robustness reports
        uses: actions/upload-artifact@v7
        with:
          name: student-performance-nested-robustness-reports
          path: reports/robustness-run/
          if-no-files-found: error
          retention-days: 30
